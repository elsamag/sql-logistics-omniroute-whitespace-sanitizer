# Target Workflow     : GitHub Actions Continuous Integration (CI) Pipeline
# File Location       : .github/workflows/ci.yml
# Dialect Standard    : Google Cloud BigQuery Standard SQL
# ============================================================================

name: Enterprise SQL CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sql-lint-and-audit:
    name: SQLFluff Lint & Dialect Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install SQL Linter & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlfluff

      - name: Execute BigQuery Dialect Linting
        run: |
          sqlfluff lint src/ --dialect bigquery

  file-integrity-check:
    name: Directory Manifest & Asset Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Production Assets
        run: |
          test -f src/01_omniroute_string_sanitization_engine.sql
          test -f src/02_whitespace_forensic_exception_logger.sql
          test -f src/03_relational_manifest_join_validator.sql
          test -f config/bigquery_env.config.json
